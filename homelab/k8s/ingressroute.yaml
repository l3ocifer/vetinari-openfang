---
# Vetinari's HTTP API at vetinari.leopaska.xyz — Authelia in front.
# Used by:
#   • Leo's MacBook (`openfang chat vetinari` thin client)
#   • Vetinari's own `/api/cron/run/*` triggers from the heartbeat job
#   • A2A inbound from siblings (less common — they route via
#     ofp:50051 directly inside the cluster)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vetinari
  namespace: agents-shared
spec:
  # Cloudflare terminates TLS and the tunnel speaks plain HTTP to Traefik's
  # `web` entrypoint; a websecure-only router, a `tls:` block (TLS-only
  # routers on every entrypoint) or a cross-namespace middleware ref
  # (allowCrossNamespace is off) each make Traefik drop the router -> 404.
  entryPoints: [web]
  routes:
    - match: Host(`vetinari.leopaska.xyz`)
      kind: Rule
      services:
        - name: vetinari
          namespace: agents-shared
          port: 4200
      middlewares:
        - name: authelia   # agents-shared copy, homelab infrastructure/authelia-middleware.yaml
